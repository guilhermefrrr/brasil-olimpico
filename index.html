:root{
  --green:#7FB069;
  --green-light:#E8F3EC;
  --bg:#FAFAF7;
  --text:#1F2937;
  --dark:#2D4A32;
  --gold:#FFD700;
  --silver:#C0C0C0;
  --bronze:#CD7F32;
  --yellow:#FDE68A;
  --line:#E5E7EB;
  --muted:#6B7280;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#121713;
    --text:#F3F4F6;
    --line:#2E3A32;
    --green-light:#1D2D22;
    --muted:#9CA3AF;
  }
}

*{
  box-sizing:border-box;
}

html{
  scroll-padding-top:60px;
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}

section{
  scroll-margin-top:60px;
}

.filter-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:thin;
}

.filter-row::-webkit-scrollbar{
  height:4px;
}

.filter-btn{
  flex:0 0 auto;
  white-space:nowrap;
  height:32px;
  padding:6px 10px;
  font-size:13px;
  line-height:1;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  cursor:pointer;
}

.filter-btn:hover{
  border-color:var(--green);
}

.filter-btn.active{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

@media (prefers-color-scheme: dark){
  .filter-btn{
    background:#1C2620;
  }
}

.chart-scroll{
  overflow-x:auto;
  scrollbar-width:thin;
}

.bar-label{
  overflow-wrap:break-word;
  word-break:normal;
  hyphens:none;
}

.focus\:border-\[\#7FB069\]:focus {
  --tw-border-opacity: 1;
  border-color: rgb(127 176 105 / var(--tw-border-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-\[minmax\(180px\2c 1fr\)_1fr_auto\] {
    grid-template-columns: minmax(180px,1fr) 1fr auto;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:justify-between {
    justify-content: space-between;
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:gap-\[4px\] {
    gap: 4px;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:py-16 {
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:text-\[10px\] {
    font-size: 10px;
  }

  .sm\:text-\[76px\] {
    font-size: 76px;
  }
}

@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}
