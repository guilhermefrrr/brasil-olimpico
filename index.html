.text-sm{

.text-xs{

.text-\[var\(--green-deep\)\]{

.text-\[var\(--ink\)\]{

.text-\[var\(--muted\)\]{

}

.text-\[var\(--yellow\)\]{

}

.text-\[var\(--yellow-deep\)\]{
  color: var(--yellow-deep);

}

}

.shadow{

.shadow-lg{

:root{
  --green:#7FB069;
  --green-deep:#2D4A32;
  --green-soft:#E8F3EC;
  --yellow:#FDE68A;
  --yellow-deep:#7A5A00;
  --yellow-bar:#FACC15;
  --blue:#93C5FD;
  --blue-deep:#1E40AF;
  --blue-soft:#DBEAFE;
  --pink:#F9A8D4;
  --pink-deep:#831843;
  --purple:#C4B5FD;
  --purple-deep:#4C1D95;
  --gold:#FFD700;
  --silver:#C0C0C0;
  --bronze:#CD7F32;
  --surface:#FAFAF7;
  --card:#ffffff;
  --ink:#1F2937;
  --muted:#6B7280;
  --line:#E5E7EB;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#232A24;
    --card:#2C352E;
    --ink:#F3F4F6;
    --muted:#C3CFC6;
    --line:#3E4C42;
    --green-soft:#2F4034;
    --blue-soft:#2E3B4D;
    --yellow:#8A7A2E;
    --yellow-deep:#FDE68A;
  }
}

*{
  box-sizing:border-box
}

/* Rolagem: 30px no desktop e 55px no mobile.
   Header e posição das seções intactos. */

html{
  scroll-behavior:smooth;
  scroll-padding-top:30px
}

main section[id]{
  scroll-margin-top:30px
}

@media (max-width:1023px){
  html{
    scroll-padding-top:55px
  }

  main section[id]{
    scroll-margin-top:55px
  }
}

/* Subtítulo da aba Estados: sempre em DUAS LINHAS, sem barra vertical.
   display:block + white-space:normal garantem a quebra, mesmo que algum
   estilo global tente forçar nowrap/flex em outro lugar. */

#subtitulo-estados{
  display:block !important;
  white-space:normal !important;
  flex:none !important
}

#subtitulo-estados > span{
  display:block !important;
  white-space:normal !important
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif
}

.font-display{
  font-family:'Archivo',system-ui,sans-serif
}

button,input{
  font:inherit
}

/* Correção mobile: os botões de filtro nunca ficam atrás de outro
   elemento. Ancestrais dos filtros usam pointer-events:auto e
   touch-action:auto — sem bloqueio de toque. */

button,a{
  touch-action:auto;
}

button{
  cursor:pointer;
  pointer-events:auto;
  position:relative;
  z-index:1;
}

main{
  position:relative;
  z-index:0;
  pointer-events:auto;
  touch-action:auto;
}

.filter-row{
  overflow:visible;
  pointer-events:auto;
  touch-action:auto;
}

.filter-row-controls{
  overflow:visible;
  pointer-events:auto;
  touch-action:auto;
}

/* Linhas de botões (Ano, Modalidade, Estação, Medalha, Gênero, Formato): 1 linha, sem quebrar.
   Rolagem horizontal se precisar, botões compactos de 32px. */

.filter-row-controls--scroll{
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  gap:6px;
  padding-bottom:2px;
  align-items:center;
  min-width:0;
}

.filter-row-controls--scroll button{
  flex-shrink:0;
  white-space:nowrap;
  font-size:13px;
  min-height:32px;
  padding:6px 10px;
  border-radius:999px;
  line-height:1.2;
}

.filter-row-controls button,[role="tablist"] button{
  min-height:32px;
  touch-action:auto;
  pointer-events:auto;
  position:relative;
  z-index:1;
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.filter-row{
  display:grid;
  grid-template-columns:90px minmax(0,1fr);
  gap:8px;
  align-items:center
}

.filter-row--bare{
  grid-template-columns:minmax(0,1fr)
}

.filter-row-label{
  text-align:right;
  font-weight:600;
  align-self:center;
  font-size:12px;
  line-height:1.2;
  text-transform:uppercase;
  letter-spacing:.04em
}

.filter-row-controls{
  display:flex;
  flex-wrap:nowrap;
  gap:6px;
  align-items:center;
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  padding-bottom:2px
}

@media (max-width:640px){
  .filter-row{
    grid-template-columns:80px minmax(0,1fr)
  }

  .filter-row--bare{
    grid-template-columns:minmax(0,1fr)
  }
}

.last\:border-0:last-child{
  border-width: 0px;
}

.hover\:border-\[var\(--green\)\]:hover{
  border-color: var(--green);
}

.hover\:bg-white\/25:hover{
  background-color: rgb(255 255 255 / 0.25);
}

.focus\:border-\[var\(--green\)\]:focus{
  border-color: var(--green);
}

@media (min-width: 640px){
  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:gap-4{
    gap: 1rem;
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-8{
    padding-top: 2rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-6xl{
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-\[28px\]{
    font-size: 28px;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:order-none{
    order: 0;
  }

  .md\:inline-flex{
    display: inline-flex;
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:flex{
    display: flex;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-6{
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .lg\:p-12{
    padding: 3rem;
  }

  .lg\:text-7xl{
    font-size: 4.5rem;
    line-height: 1;
  }
}
